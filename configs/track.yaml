# Tracker settings (src/rlairhockey/track.py). Distances in m, speeds in m/s, times in s.
min_score: 0.15       # detections below this are ignored (detect_clips.py saves down to 0.1)
puck:
  z: 0.003            # height of the box center (pucks are ~5 mm thick)
  vmax: 30            # fastest plausible puck; pro shots reach ~20 m/s
  margin: 0.05        # how far outside the surface a detection may land (calibration error)
  goal_depth: 0.15    # extra room past an end rail inside the goal mouth
mallet:
  z: 0.04             # height of the box center; mallets are ~9 cm tall
  vmax: 10
  margin: 0.08
  center_overlap: 0.05  # a mallet's center may sit this far over the center line
path:                 # dynamic-programming costs, per frame unless noted
  max_skip: 0.25      # longest gap between detections bridged with a motion check
  w_score: 1.0        # reward for a detection on the path, times its score
  w_move: 0.5         # cost of a step, times (distance / farthest plausible distance)
  w_dist: 1.0         # plus this per meter, so detours out to a stray box and back don't pay
  gap: 0.3            # cost of a frame without a detection
  lost: 3.0           # cost of losing the target and picking it up again anywhere
parked:               # a spare puck or mallet that sits still while another candidate is in play
  radius: 0.03
  min_frac: 0.5       # present in at least this fraction of the clip's frames
  coexist: 0.3        # with another candidate of its kind in view in at least this fraction of them
smooth:               # constant-velocity Kalman filter + RTS smoother
  max_gap: 0.2        # fill gaps up to this long; longer gaps stay empty
  meas_sigma: {puck: 0.01, mallet: 0.02}
  accel_sigma: {puck: 60, mallet: 25}
impacts:              # where the puck's velocity jumps: a rail, an end wall, a mallet (track.py, smooth_puck)
  sigma: 0.02         # detection noise, the unit of fit residual when splitting the path into pieces
  penalty: 30         # cost of a split, in sigma^2
  min_len: 4          # detections per piece
  window: 3.0         # longest piece fitted at once
  fit: 0.25           # seconds of detections either side that give the velocities in and out
  min_dv: 0.5         # a smaller velocity change is no impact
  rel_dv: 0.25        # nor one under this fraction of the speed
  other_dv: 1.5       # an unexplained change (no mallet or wall nearby) counts from this size
  puck_r: 0.041
  mallet_r: 0.05
  mallet_tol: 0.10    # a strike when a mallet comes within touching distance plus this (+-2 frames)
  rail_tol: 0.12      # a bounce when the contact is within this of the rail line (calibration error)
fill:                 # puck gaps longer than smooth.max_gap (an arm in the way, a missed fast puck): track.py, bridge()
  max: 1.0            # s; longer gaps stay empty
  bounce_cost: 0.3    # m/s added for a wall bounce inside the gap (scores are velocity mismatch at the ends, m/s)
  impact_cost: 1.0    # m/s added for an impact inside the gap (a free corner fits almost anything)
