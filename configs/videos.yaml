# Per-video settings. Times in seconds of the source video.
# game_start / game_end: manual overrides (null = let the script estimate).
# score_roi: x0, y0, x1, y1 (pixels at 1920 x 1080) around both players' points on the broadcast scoreboard
# (score_changes.py; score_channel: red reads red digits as redness); score_cells: each player's points digit within that box, as fractions of it
# (check_goals.py).
# game_start = faceoff release, game_end = final goal; found by eye from contact sheets
# (scripts/contact_sheet.py), 30 s coarse pass then 2 s / 0.5 s / 0.1 s refinement.
#   2024:  5:27.8 ->  auto     2023:  1:37.0 -> 41:46.8   2022 final: 0:05.0 -> 12:35.1
#   2022 WC: 7:51.7 -> 28:40.8   Texas: 7:13.1 -> 37:16.7
