<title>Match Cut Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an edit-bay review sheet. Tabs per match, a full-width timeline strip, then one row per segment. */
:root {
  --bg: #f3f6f8; --panel: #ffffff; --ink: #14212b; --muted: #5b6b78; --line: #d6dee5; --accent: #0a8fb8;
  --ok: #1f8a4c; --bad: #c2362f;
  --l-intro: #8a97a3; --l-play: #12a5c9; --l-idle: #e3b341; --l-replay: #8b5cf6; --l-cutaway: #e0679a;
  --l-break: #e8762c; --l-outro: #5d6b78; --l-black: #2b333a; --l-other: #b0b8bf;
  --c1: #0e7490; --c2: #65a30d; --c3: #c026d3; --c4: #ea580c; --c5: #475569;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d1419; --panel: #152029; --ink: #e4edf3; --muted: #93a4b1; --line: #26343f; --accent: #3cc4ea;
    --ok: #46c27a; --bad: #f06b62; --l-black: #5c6670; --l-outro: #7d8b97; --c5: #94a3b8;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1419; --panel: #152029; --ink: #e4edf3; --muted: #93a4b1; --line: #26343f; --accent: #3cc4ea;
  --ok: #46c27a; --bad: #f06b62; --l-black: #5c6670; --l-outro: #7d8b97; --c5: #94a3b8;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font: 700 30px/1.1 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 70ch; margin: 4px 0 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: 600 15px var(--display); padding: 7px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.tab:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
.head h2 { font: 600 22px var(--display); margin: 0; }
.meta { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.timeline { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px 8px; }
.tl-scroll { overflow-x: auto; }
.tl { position: relative; min-width: 640px; }
.bar { position: relative; height: 30px; border-radius: 3px; overflow: hidden; background: var(--line); }
.bar.ang { height: 8px; margin-top: 3px; background: transparent; }
.bar > i { position: absolute; top: 0; bottom: 0; cursor: pointer; }
.bar > i:hover { filter: brightness(1.2); }
.ticks { position: relative; height: 18px; font: 11px var(--mono); color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); top: 3px; }
.marker { position: absolute; top: -4px; height: 46px; width: 2px; background: var(--ink); }
.marker b { position: absolute; top: -16px; left: 4px; font: 500 11px var(--mono); white-space: nowrap; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; }
.filters label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.progress { font: 13px var(--mono); color: var(--muted); }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--lc); border-radius: 6px; padding: 8px 10px; }
.row.flash { outline: 2px solid var(--accent); }
.thumbs { display: flex; gap: 3px; }
.th { width: 120px; aspect-ratio: 16/9; max-width: 100%; background-repeat: no-repeat; border-radius: 3px; background-color: var(--line); }
.info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.l1 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.pill { font: 600 13px var(--display); letter-spacing: .04em; text-transform: uppercase; padding: 1px 8px; border-radius: 4px; color: #fff; background: var(--lc); }
.cam { font: 500 12px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
.tc { font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.sub { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.sub a { color: var(--accent); }
.verdict { display: flex; flex-direction: column; gap: 5px; align-items: stretch; min-width: 210px; }
.vb { display: flex; gap: 5px; }
.vb button { flex: 1; font: 600 14px var(--display); padding: 5px 10px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.vb button.on.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.vb button.on.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.fix { display: flex; gap: 5px; }
.fix[hidden] { display: none !important; }
.fix select, .fix input { font: 13px var(--body); padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); min-width: 0; }
.fix input { flex: 1; }
.empty { color: var(--muted); padding: 24px; text-align: center; background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; }
.status { font-size: 13px; color: var(--muted); }
@media (max-width: 760px) {
  .row { grid-template-columns: 1fr; }
  .th { width: calc((100% - 6px) / 3); }
  .verdict { min-width: 0; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="wrap">
  <header>
    <h1>Match Cut Review</h1>
    <p class="lede">Check how the prep script split each match into intro, play, breaks, replays and camera angles. Each row shows the first, middle and last frame of a segment. Mark it correct, or wrong with what it should be. Answers save automatically and feed the next tuning pass.</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Matches"></nav>
  <section id="video"></section>
</div>

<script id="data" type="application/json">/*DATA*/</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const LABELS = ["intro", "play", "idle", "replay", "cutaway", "break", "outro", "black"];
const LABEL_HELP = { intro: "before the game starts", play: "live game (no camera = unusual angle)", idle: "table view, nothing moving", replay: "replay of earlier play, with its intro/outro graphics", cutaway: "short off-table shot", break: "long stop between play", outro: "after the game ends", black: "black frames" };
const verdicts = new Map();   // "<vid>__t<start in 0.1 s>" -> doc body
let db = null, current = DATA.videos[0]?.id, filters = { labels: new Set(LABELS), unreviewed: false, minDur: 0 };

const $ = (s, el = document) => el.querySelector(s);
const fmt = x => { const s = Math.round(x * 10) / 10; return `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`; };
const lc = l => `var(--l-${LABELS.includes(l) ? l : "other"})`;
const camColor = a => a ? `var(--c${Math.min(5, +a.replace("cam", "") || 5)})` : "transparent";
// verdicts are keyed by segment start; one only counts while the segment it was given
// for is unchanged (same label and end), so re-running the script never misapplies it
const key = (vid, s) => `${vid}__t${Math.round(s.s * 10)}`;
const verdictOf = (vid, s) => { const d = verdicts.get(key(vid, s)); return d && d.label === s.label && Math.abs(d.end - s.e) < 0.25 ? d : null; };

function renderTabs() {
  const tabs = $("#tabs"); tabs.textContent = "";
  for (const v of DATA.videos) {
    const b = document.createElement("button");
    b.className = "tab"; b.role = "tab"; b.id = "tab-" + v.id;
    b.setAttribute("aria-selected", v.id === current);
    const n = v.segs.length, done = v.segs.filter(s => verdictOf(v.id, s)).length;
    b.textContent = `${v.name} · ${done}/${n}`;
    b.onclick = () => { current = v.id; render(); };
    tabs.append(b);
  }
}

function render() {
  renderTabs();
  const v = DATA.videos.find(x => x.id === current), root = $("#video");
  root.textContent = "";
  if (!v) { root.innerHTML = `<p class="empty">No matches processed yet. Run scripts/prepare_video.py, then scripts/build_review.py.</p>`; return; }
  const mins = {};
  for (const s of v.segs) mins[s.label] = (mins[s.label] || 0) + (s.e - s.s) / 60;
  const reviewed = v.segs.filter(s => verdictOf(v.id, s));
  const wrong = reviewed.filter(s => verdictOf(v.id, s).verdict === "wrong").length;
  root.innerHTML = `
    <div class="wrap" style="gap:12px">
      <div class="head"><h2>${v.name}</h2>
        <span class="meta">youtu.be/${v.id} · ${v.fps} fps · ${fmt(v.duration)} · ${v.segs.length} segments</span></div>
      <div class="chips">${LABELS.filter(l => mins[l]).map(l => `<span class="chip"><i class="sw" style="background:${lc(l)}"></i>${l} ${mins[l].toFixed(1)} min</span>`).join("")}</div>
      <div class="timeline"><div class="tl-scroll"><div class="tl" id="tl">
        <div class="bar" id="bar"></div><div class="bar ang" id="ang"></div><div class="ticks" id="ticks"></div>
      </div></div></div>
      <div class="filters" id="filters"></div>
      <div class="progress">Reviewed ${reviewed.length} of ${v.segs.length} · marked wrong ${wrong}</div>
      <div class="status" id="status"></div>
      <div class="rows" id="rows"></div>
    </div>`;
  const D = v.duration, bar = $("#bar"), ang = $("#ang"), ticks = $("#ticks"), tl = $("#tl");
  for (const s of v.segs) {
    const left = (s.s / D * 100) + "%", width = Math.max(0.05, (s.e - s.s) / D * 100) + "%";
    const a = document.createElement("i");
    a.style.cssText = `left:${left};width:${width};background:${lc(s.label)}`;
    a.title = `${s.label} ${s.angle} ${fmt(s.s)}–${fmt(s.e)}`;
    a.onclick = () => jump(v.id, s);
    bar.append(a);
    if (s.angle) { const c = document.createElement("i"); c.style.cssText = `left:${left};width:${width};background:${camColor(s.angle)}`; c.title = s.angle; ang.append(c); }
  }
  const step = D > 1800 ? 300 : 120;
  for (let t = 0; t <= D; t += step) { const sp = document.createElement("span"); sp.style.left = (t / D * 100) + "%"; sp.textContent = fmt(t).replace(/\.\d$/, ""); ticks.append(sp); }
  for (const [t, name] of [[v.game_start_cfg, "game start"], [v.game_end_cfg, "game end"]]) {
    if (t == null) continue;
    const m = document.createElement("div"); m.className = "marker"; m.style.left = (t / D * 100) + "%"; m.innerHTML = `<b${name === "game end" ? ' style="left:auto;right:4px"' : ""}>${name} ${fmt(t)}</b>`; tl.append(m);
  }

  const f = $("#filters");
  f.innerHTML = LABELS.filter(l => mins[l]).map(l => `<label><input type="checkbox" id="f-${l}" data-l="${l}" ${filters.labels.has(l) ? "checked" : ""}><i class="sw" style="background:${lc(l)}"></i>${l}</label>`).join("") +
    `<label><input type="checkbox" id="f-unrev" ${filters.unreviewed ? "checked" : ""}>only unreviewed</label>
     <label>min length <select id="f-min">${[0, 1, 3, 10].map(x => `<option value="${x}" ${filters.minDur == x ? "selected" : ""}>${x ? x + " s" : "any"}</option>`).join("")}</select></label>`;
  f.querySelectorAll("input[data-l]").forEach(cb => cb.onchange = () => { cb.checked ? filters.labels.add(cb.dataset.l) : filters.labels.delete(cb.dataset.l); renderRows(v); });
  $("#f-unrev").onchange = e => { filters.unreviewed = e.target.checked; renderRows(v); };
  $("#f-min").onchange = e => { filters.minDur = +e.target.value; renderRows(v); };
  $("#status").textContent = db ? "" : "Answers can't be saved in this view: open the page on claude.ai while signed in to record verdicts.";
  renderRows(v);
}

function renderRows(v) {
  const rows = $("#rows"); rows.textContent = "";
  const list = v.segs.filter(s => filters.labels.has(s.label) && (s.e - s.s) >= filters.minDur && !(filters.unreviewed && verdictOf(v.id, s)));
  if (!list.length) { rows.innerHTML = `<p class="empty">No segments match these filters.</p>`; return; }
  for (const s of list) rows.append(rowEl(v, s));
}

function thumb(v, idx) {
  const d = document.createElement("div"); d.className = "th";
  const r = Math.floor(idx / v.cols), c = idx % v.cols;
  d.style.backgroundImage = `url(${v.sprite})`;
  d.style.backgroundSize = `${v.cols * 100}% auto`;
  const rowsN = Math.ceil(v.segs.length * 3 / v.cols);
  d.style.backgroundPosition = `${v.cols > 1 ? c / (v.cols - 1) * 100 : 0}% ${rowsN > 1 ? r / (rowsN - 1) * 100 : 0}%`;
  return d;
}

function rowEl(v, s) {
  const k = key(v.id, s), cur = verdictOf(v.id, s);
  const el = document.createElement("div"); el.className = "row"; el.id = "row-" + k; el.style.setProperty("--lc", lc(s.label));
  const pos = v.segs.indexOf(s);
  const th = document.createElement("div"); th.className = "thumbs";
  for (let j = 0; j < 3; j++) th.append(thumb(v, pos * 3 + j));
  const info = document.createElement("div"); info.className = "info";
  info.innerHTML = `<div class="l1"><span class="pill">${s.label}</span>${s.angle ? `<span class="cam" style="border-color:${camColor(s.angle)}">${s.angle}</span>` : ""}<span class="tc">${fmt(s.s)} – ${fmt(s.e)}</span><span class="tc" style="color:var(--muted)">${(s.e - s.s).toFixed(1)} s</span></div>
    <div class="sub"><span>${LABEL_HELP[s.label] || ""}</span><span>table motion ${(s.act * 100).toFixed(2)}%</span><a href="https://www.youtube.com/watch?v=${v.id}&t=${Math.max(0, Math.floor(s.s) - 1)}s" target="_blank" rel="noopener">Watch from ${fmt(Math.max(0, Math.floor(s.s) - 1))}</a></div>`;
  const vd = document.createElement("div"); vd.className = "verdict";
  const vb = document.createElement("div"); vb.className = "vb";
  const ok = document.createElement("button"), bad = document.createElement("button");
  ok.className = "ok" + (cur?.verdict === "ok" ? " on" : ""); ok.textContent = "Correct"; ok.id = `ok-${k}`;
  bad.className = "bad" + (cur?.verdict === "wrong" ? " on" : ""); bad.textContent = "Wrong"; bad.id = `bad-${k}`;
  const fix = document.createElement("div"); fix.className = "fix"; fix.hidden = cur?.verdict !== "wrong";
  const sel = document.createElement("select"); sel.id = `sel-${k}`; sel.setAttribute("aria-label", "Should be");
  sel.innerHTML = `<option value="">should be…</option>` + [...LABELS, "split"].map(l => `<option ${cur?.should_be === l ? "selected" : ""}>${l}</option>`).join("");
  const note = document.createElement("input"); note.id = `note-${k}`; note.placeholder = "note, e.g. starts 5:27.8"; note.value = cur?.note || ""; note.setAttribute("aria-label", "Note");
  fix.append(sel, note); vb.append(ok, bad); vd.append(vb, fix);
  const disabled = !db; [ok, bad, sel, note].forEach(x => x.disabled = disabled);
  ok.onclick = () => save(v, s, { verdict: "ok", should_be: "", note: "" });
  bad.onclick = () => { fix.hidden = false; save(v, s, { verdict: "wrong", should_be: sel.value, note: note.value }); };
  sel.onchange = () => save(v, s, { verdict: "wrong", should_be: sel.value, note: note.value });
  let tmr; note.oninput = () => { clearTimeout(tmr); tmr = setTimeout(() => save(v, s, { verdict: "wrong", should_be: sel.value, note: note.value }), 700); };
  el.append(th, info, vd);
  return el;
}

function jump(vid, s) {
  let el = document.getElementById("row-" + key(vid, s));
  if (!el) { filters = { labels: new Set(LABELS), unreviewed: false, minDur: 0 }; render(); el = document.getElementById("row-" + key(vid, s)); }
  if (!el) return;
  el.scrollIntoView({ block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
}

async function save(v, s, body) {
  if (!db) return;
  const k = key(v.id, s);
  const doc = { video: v.id, seg: s.i, start: s.s, end: s.e, label: s.label, angle: s.angle, ...body, updated: new Date().toISOString() };
  verdicts.set(k, doc);
  const ok = $(`#ok-${CSS.escape(k)}`), bad = $(`#bad-${CSS.escape(k)}`);
  if (ok) { ok.classList.toggle("on", body.verdict === "ok"); bad.classList.toggle("on", body.verdict === "wrong"); }
  if (body.verdict === "ok") { const fx = ok?.closest(".verdict")?.querySelector(".fix"); if (fx) fx.hidden = true; }
  renderTabs();
  try { await db.collection("verdicts").doc(k).set(doc); $("#status").textContent = ""; }
  catch (e) { $("#status").textContent = e.code === "quota_exceeded" ? "The answer store is full, so this answer wasn't saved." : "This answer couldn't be saved. Check your connection and click again."; }
}

render();
(async () => {
  db = await window.claude?.use?.("db") ?? null;
  if (!db) { render(); return; }
  let first = true;
  db.collection("verdicts").onSnapshot(snap => {
    verdicts.clear();
    for (const d of snap.docs) verdicts.set(d.id, d.data());
    if (first) { first = false; render(); } else renderTabs();
  }, () => { db = null; render(); });
})();
</script>
